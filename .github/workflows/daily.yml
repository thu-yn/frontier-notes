name: 每日出版

on:
  push:
    branches: [main]
    paths:
      - "data/daily/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验最新一期
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.validate import validate_issue
          path = max(Path('data/daily').glob('*.json'))
          validate_issue(path, path.stem)
          PY

      - name: 构建站点
        run: python scripts/build.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
